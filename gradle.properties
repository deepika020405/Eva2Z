#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx5120M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
compose.resources.always.generate.accessors=true
kotlin.native.enableCommonization=true
# Kotlin/Native caches are the memory hog during iOS debug links on a 16 GB
# machine. Disabling them trades some link time for a much smaller heap.
kotlin.native.cacheKind=none
# By default the Kotlin/Native linker runs IN-PROCESS inside the Gradle daemon,
# and that code path ignores kotlin.native.jvmArgs — so the link was capped by
# org.gradle.jvmargs (4 GB) and OOMed. Forcing the compiler out of the daemon
# makes it a separate JVM whose heap kotlin.native.jvmArgs actually controls.
# (Property name is confusing: "disableCompilerDaemon=true" = run in a separate
# process, not in the Gradle daemon.)
kotlin.native.disableCompilerDaemon=true
kotlin.native.jvmArgs=-Xmx6g


# Force Gradle to use JDK 24 only for this project
#org.gradle.java.home=C\:\\Program Files\\Java\\jdk-21