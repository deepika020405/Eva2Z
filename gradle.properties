#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx5120M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
compose.resources.always.generate.accessors=true
kotlin.native.enableCommonization=true
# NOTE: kotlin.native.cacheKind=none used to live here to keep iOS debug links
# inside a 16 GB machine's memory. Kotlin removed that property in 2.3.20, so it
# was silently doing nothing; the out-of-process compiler below covers the heap
# problem instead. If links ever OOM again, use the new DSL — kotl.in/disable-native-cache.
#
# By default the Kotlin/Native linker runs IN-PROCESS inside the Gradle daemon,
# and that code path ignores kotlin.native.jvmArgs — so the link was capped by
# org.gradle.jvmargs (4 GB) and OOMed. Forcing the compiler out of the daemon
# makes it a separate JVM whose heap kotlin.native.jvmArgs actually controls.
# (Property name is confusing: "disableCompilerDaemon=true" = run in a separate
# process, not in the Gradle daemon.)
kotlin.native.disableCompilerDaemon=true
# That forked JVM also inherits a tiny default code cache (48 MB), which the K2
# Native frontend fills up ("Out of space in CodeCache for adapters"), so size it
# explicitly too.
kotlin.native.jvmArgs=-Xmx6g -XX:ReservedCodeCacheSize=512m
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false


# Force Gradle to use JDK 24 only for this project
#org.gradle.java.home=C\:\\Program Files\\Java\\jdk-21